<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="title desc"><title id="title">AI automation architecture</title><desc id="desc">A central AI orchestration engine connects event triggers, data context, planning, tools, validation and execution. Animated signals illustrate a conceptual workflow.</desc><rect width="960" height="590" rx="8" fill="#0d1117"/><g font-family="Georgia,serif" fill="#e6edf3"><text x="34" y="62" font-size="33">Intelligent automation</text><text x="34" y="86" font-size="14" fill="#a0aab5">From incoming events to validated, actionable outcomes.</text></g><g font-family="monospace" font-size="11" fill="#d4b477"><text x="34" y="29" letter-spacing="2">SYSTEM ARCHITECTURE / AGENTIC WORKFLOW</text></g><g fill="none" stroke="#3d4b57"><circle cx="480" cy="310" r="143"/><circle cx="480" cy="310" r="130" stroke-dasharray="2 6"/><circle cx="480" cy="310" r="101"/><path d="M480 167 A143 143 0 1 1 479.9 167" stroke-dasharray="5 13" stroke="#8b7651"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="18s" repeatCount="indefinite"/></path></g><path d="M272 174 H313 L365 223" stroke="#52616c" fill="none"/><circle r="3.5" fill="#d4b477"><animateMotion path="M272 174 H313 L365 223" dur="2.5s" begin="0.0s" repeatCount="indefinite"/></circle><rect x="34" y="145" width="238" height="70" rx="5" fill="#111922" stroke="#303d48"/><text x="47" y="163" font-family="monospace" font-size="10" fill="#d4b477">01</text><text x="47" y="185" font-family="Georgia,serif" font-size="18" fill="#e6edf3">Event triggers</text><text x="47" y="202" font-family="sans-serif" font-size="11" fill="#a8b4bd">Schedules, requests, events</text><path d="M272 304 H337" stroke="#52616c" fill="none"/><circle r="3.5" fill="#d4b477"><animateMotion path="M272 304 H337" dur="2.8s" begin="0.45s" repeatCount="indefinite"/></circle><rect x="34" y="275" width="238" height="70" rx="5" fill="#111922" stroke="#303d48"/><text x="47" y="293" font-family="monospace" font-size="10" fill="#d4b477">02</text><text x="47" y="315" font-family="Georgia,serif" font-size="18" fill="#e6edf3">Context &amp; data</text><text x="47" y="332" font-family="sans-serif" font-size="11" fill="#a8b4bd">Retrieve, clean, enrich</text><path d="M272 434 H313 L365 396" stroke="#52616c" fill="none"/><circle r="3.5" fill="#d4b477"><animateMotion path="M272 434 H313 L365 396" dur="3.1s" begin="0.9s" repeatCount="indefinite"/></circle><rect x="34" y="405" width="238" height="70" rx="5" fill="#111922" stroke="#303d48"/><text x="47" y="423" font-family="monospace" font-size="10" fill="#d4b477">03</text><text x="47" y="445" font-family="Georgia,serif" font-size="18" fill="#e6edf3">Planning</text><text x="47" y="462" font-family="sans-serif" font-size="11" fill="#a8b4bd">Decompose tasks and route</text><path d="M595 223 L647 174 H688" stroke="#52616c" fill="none"/><circle r="3.5" fill="#d4b477"><animateMotion path="M595 223 L647 174 H688" dur="3.4s" begin="1.35s" repeatCount="indefinite"/></circle><rect x="688" y="145" width="238" height="70" rx="5" fill="#111922" stroke="#303d48"/><text x="701" y="163" font-family="monospace" font-size="10" fill="#d4b477">04</text><text x="701" y="185" font-family="Georgia,serif" font-size="18" fill="#e6edf3">Tool integration</text><text x="701" y="202" font-family="sans-serif" font-size="11" fill="#a8b4bd">APIs, services, workflows</text><path d="M623 304 H688" stroke="#52616c" fill="none"/><circle r="3.5" fill="#d4b477"><animateMotion path="M623 304 H688" dur="3.7s" begin="1.8s" repeatCount="indefinite"/></circle><rect x="688" y="275" width="238" height="70" rx="5" fill="#111922" stroke="#303d48"/><text x="701" y="293" font-family="monospace" font-size="10" fill="#d4b477">05</text><text x="701" y="315" font-family="Georgia,serif" font-size="18" fill="#e6edf3">Validation</text><text x="701" y="332" font-family="sans-serif" font-size="11" fill="#a8b4bd">Rules, checks, human review</text><path d="M595 396 L647 434 H688" stroke="#52616c" fill="none"/><circle r="3.5" fill="#d4b477"><animateMotion path="M595 396 L647 434 H688" dur="4.0s" begin="2.25s" repeatCount="indefinite"/></circle><rect x="688" y="405" width="238" height="70" rx="5" fill="#111922" stroke="#303d48"/><text x="701" y="423" font-family="monospace" font-size="10" fill="#d4b477">06</text><text x="701" y="445" font-family="Georgia,serif" font-size="18" fill="#e6edf3">Execution &amp; feedback</text><text x="701" y="462" font-family="sans-serif" font-size="11" fill="#a8b4bd">Act, log, monitor, improve</text><g fill="none" stroke="#79bdb5" stroke-width="1.3"><path d="M420 265 L480 240 L540 265 L480 290 Z M420 265 L420 300 L480 325 L540 300 L540 265 M480 290 V325 M420 300 L420 335 L480 360 L540 335 L540 300 M480 325 V360"/><circle cx="480" cy="240" r="4" fill="#d4b477"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle></g><text x="480" y="391" text-anchor="middle" font-family="monospace" font-size="12" fill="#d4b477">AI ORCHESTRATION ENGINE</text><text x="480" y="410" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a8b4bd">Reason · Route · Coordinate</text><path d="M807 475 V505 H153 V475" stroke="#79bdb5" stroke-dasharray="4 6" fill="none"/><circle r="3" fill="#79bdb5"><animateMotion path="M807 475 V505 H153 V475" dur="8s" repeatCount="indefinite"/></circle><text x="480" y="524" text-anchor="middle" font-family="monospace" font-size="10" fill="#79bdb5">CONTINUOUS FEEDBACK / OBSERVABILITY</text><path d="M34 548H926" stroke="#30363d"/><text x="34" y="570" font-family="monospace" font-size="10" fill="#a8b4bd">CONCEPTUAL SYSTEM · NOT A LIVE PERFORMANCE REPORT</text></svg>